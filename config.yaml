# ═══════════════════════════════════════════════════
# BACKUP AUTOMATION SYSTEM — CONFIGURATION
# ═══════════════════════════════════════════════════
# Edit this file to change any setting.
# Restart the PrefectWorker service after changes.
# No code changes needed.
# ═══════════════════════════════════════════════════

# ═══════════════════════════════════════════════════
# FIRM IDENTIFICATION
# ═══════════════════════════════════════════════════
firm:
  name: "AAM Associates"

# ═══════════════════════════════════════════════════
# FILE SYSTEM PATHS
# ═══════════════════════════════════════════════════
paths:
  source_drive: "D:\\"
  lan_destination: "\\\\192.168.10.10\\hp srv manual backup$"
  log_directory: "C:\\BackupAgent\\logs"
  database_path: "C:\\BackupAgent\\manifest.db"
  rclone_temp_directory: "C:\\BackupAgent\\rclone_temp"

# ═══════════════════════════════════════════════════
# SCHEDULE
# ═══════════════════════════════════════════════════
schedule:
  enabled: true
  daily_time: "23:00"

# ═══════════════════════════════════════════════════
# BACKUP SCOPE — WHAT GETS BACKED UP
# ═══════════════════════════════════════════════════
backup_scope:
  exclude_folders:
    - "D:\\WINMAN\\Winman's mir bkup"
    - "D:\\WINMAN\\winmanbackup"
    - "D:\\WINMAN\\winman_backup"
    - "D:\\WINMAN\\winman__backup"
    - "D:\\Winman's mir bkup"
    - "D:\\winman_backup"
    - "D:\\Common Folder"
    - "D:\\DELL SRV F"
    - "D:\\Software_IT"
    - "D:\\BackupAgent"
  exclude_extensions:
    - ".lnk"
    - ".tmp"
    - ".temp"
  exclude_patterns:
    - "~$*"
    - "desktop.ini"
    - "Thumbs.db"
  full_rescan_every_n_runs: 30

# ═══════════════════════════════════════════════════
# LAN BACKUP
# ═══════════════════════════════════════════════════
lan_backup:
  enabled: true
  retry_count: 3
  retry_wait_seconds: 10
  subprocess_timeout_seconds: 14400

# ═══════════════════════════════════════════════════
# WAKE-ON-LAN
# ═══════════════════════════════════════════════════
wol:
  enabled: true
  mac_address: ""
  server_ip: "192.168.10.10"
  wake_timeout_seconds: 300
  ping_interval_seconds: 15
  stability_wait_seconds: 30

# ═══════════════════════════════════════════════════
# VOLUME SHADOW COPY (VSS)
# Set enabled: true if Tally/Winman run overnight
# ═══════════════════════════════════════════════════
vss:
  enabled: false
  drive_letter: "D"
  fallback_on_failure: true

# ═══════════════════════════════════════════════════
# CLOUD BACKUP
# ═══════════════════════════════════════════════════
cloud_backup:
  enabled: true
  provider: "gcs"
  bucket: ""
  remote_path: "D_Drive_Backup"
  gcs_location: "asia-south1"
  bandwidth_limit: "10M"
  chunk_size: "100M"
  retry_count: 3
  subprocess_timeout_seconds: 21600

# ═══════════════════════════════════════════════════
# CLOUD CREDENTIALS
# ═══════════════════════════════════════════════════
cloud_credentials:
  credential_name: "BackupAgent_GCS"

# ═══════════════════════════════════════════════════
# STATUS UI
# ═══════════════════════════════════════════════════
ui:
  enabled: true
  host: "0.0.0.0"
  port: 8080
  prefect_api_url: "http://127.0.0.1:4200/api"

# ═══════════════════════════════════════════════════
# NOTIFICATIONS
# ═══════════════════════════════════════════════════
notifications:
  smtp_host: ""
  smtp_port: 587
  smtp_username: ""
  smtp_password_credential: "BackupAgent_SMTP"
  sender: ""
  recipients: []
  send_on_every_run: true
  send_on_failure: true
  weekly_summary_enabled: true
  weekly_summary_day: "monday"
  weekly_summary_time: "08:00"

# ═══════════════════════════════════════════════════
# ALERTS
# ═══════════════════════════════════════════════════
alerts:
  no_changes_warning_days: 7
  lan_free_space_warning_gb: 50
  backup_duration_warning_minutes: 180
  backup_not_run_warning_days: 2
  source_free_space_warning_gb: 5

# ═══════════════════════════════════════════════════
# TEST RESTORE — Periodic random file verification
# ═══════════════════════════════════════════════════
test_restore:
  enabled: true
  sample_count: 10
  run_every_n_backups: 7

# ═══════════════════════════════════════════════════
# RECONCILIATION — Periodic destination audit (D-003)
# ═══════════════════════════════════════════════════
reconciliation:
  enabled: true
  run_every_n_backups: 7
  auto_correct: true

# ═══════════════════════════════════════════════════
# MANIFEST BACKUP — WAL checkpoint, SHA256, retention (D-008)
# ═══════════════════════════════════════════════════
manifest_backup:
  enabled: true
  lan_path: "_manifest/"
  cloud_path: "_manifest/"
  retention_count: 7

# ═══════════════════════════════════════════════════
# CLOUD ARCHIVE — Yearly FY data move (GCS)
# ═══════════════════════════════════════════════════
cloud_archive:
  enabled: true
  trigger_date: "04-01"
  active_path: "D_Drive_Backup/active/"
  archive_path: "D_Drive_Backup/archive/"
  storage_class: "ARCHIVE"

# ═══════════════════════════════════════════════════
# ANOMALY DETECTION — File count spike/silence detection
# ═══════════════════════════════════════════════════
anomaly_detection:
  enabled: true
  max_file_count_spike_ratio: 5.0
  max_deletion_spike_ratio: 10.0
  silence_days_alert: 7
  lookback_window_days: 14

# ═══════════════════════════════════════════════════
# LAN INTEGRITY — Periodic full checksum audit
# ═══════════════════════════════════════════════════
lan_integrity:
  enabled: true
  run_every_n_backups: 7
  sample_count: 500
  checksum_concurrency: 4
