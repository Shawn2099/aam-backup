firm:
  name: "AAM Associates"

paths:
  source_drive: "E:\\"
  lan_destination: "\\\\localhost\\BackupDest"
  log_directory: "C:\\Users\\Administrator\\Desktop\\aam\\demo_logs"
  database_path: "C:\\Users\\Administrator\\Desktop\\aam\\demo_manifest.db"
  rclone_temp_directory: "C:\\Users\\Administrator\\Desktop\\aam\\demo_rclone_temp"

schedule:
  enabled: false
  daily_time: "23:00"

backup_scope:
  exclude_folders:
    - "E:\\WINMAN\\Winman's mir bkup"
    - "E:\\WINMAN\\winmanbackup"
    - "E:\\WINMAN\\winman_backup"
    - "E:\\WINMAN\\winman__backup"
    - "E:\\Winman's mir bkup"
    - "E:\\winman_backup"
    - "E:\\Common Folder"
    - "E:\\DELL SRV F"
    - "E:\\Software_IT"
    - "E:\\BackupAgent"
  exclude_extensions:
    - ".lnk"
    - ".tmp"
    - ".temp"
  exclude_patterns:
    - "~$*"
    - "desktop.ini"
    - "Thumbs.db"

lan_backup:
  enabled: true
  retry_count: 3
  retry_wait_seconds: 10
  subprocess_timeout_seconds: 3600

wol:
  enabled: false
  mac_address: "00:00:00:00:00:00"
  server_ip: "127.0.0.1"
  wake_timeout_seconds: 300
  ping_interval_seconds: 15
  stability_wait_seconds: 30

vss:
  enabled: false
  drive_letter: "E"
  fallback_on_failure: true

cloud_backup:
  enabled: false
  provider: "gcs"
  bucket: "demo-bucket"
  remote_path: "E_Drive_Backup"
  gcs_location: "asia-south1"
  bandwidth_limit: "10M"
  chunk_size: "100M"
  retry_count: 3
  subprocess_timeout_seconds: 3600

cloud_credentials:
  credential_name: "BackupAgent_GCS"

ui:
  enabled: true
  host: "0.0.0.0"
  port: 8080
  prefect_api_url: "http://127.0.0.1:4200/api"

notifications:
  smtp_host: ""
  smtp_port: 587
  smtp_username: ""
  smtp_password_credential: "BackupAgent_SMTP"
  sender: ""
  recipients: []
  send_on_every_run: false
  send_on_failure: false
  weekly_summary_enabled: false
  weekly_summary_day: "monday"
  weekly_summary_time: "08:00"

alerts:
  no_changes_warning_days: 7
