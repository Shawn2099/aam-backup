[project]
name = "aam-backup-v2"
version = "0.1.0"
description = "Automated daily backup of Windows Server D:\\ drive to LAN and GCS"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.136.1",
    "httpx>=0.28.1",
    "keyring>=25.7.0",
    "loguru>=0.7.3",
    "prefect>=3.7.1",
    "prefect-email>=0.4.0",
    "pydantic>=2.13.4",
    "pyyaml>=6.0.3",
    "sqlalchemy>=2.0.49",
    "typer>=0.25.1",
    "uvicorn>=0.47.0",
    "wakeonlan>=3.1.0",
    "xxhash>=3.7.0",
    "google-cloud-storage>=3.2.0",
]

[project.optional-dependencies]
preflight = [
    "psutil>=6.0.0",
    "ntplib>=0.4.0",
]

[dependency-groups]
dev = [
    "freezegun>=1.5.5",
    "mypy>=2.1.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "pytest-mock>=3.15.1",
    "ruff>=0.15.13",
]

[tool.pytest.ini_options]
addopts = "-v --tb=short"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.12"
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
    "prefect_email.*",
    "wakeonlan.*",
    "keyring.*",
]
ignore_missing_imports = true

