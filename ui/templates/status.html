<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backup Status — AAM Associates</title>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div x-data="backupStatus()" x-cloak class="max-w-lg w-full">

        <!-- Header -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-bold text-gray-800">Backup Status</h1>
            <p class="text-gray-500 mt-1">AAM Associates — Automated Daily Backup</p>
        </div>

        <!-- Warning Banner: Both destinations disabled -->
        <template x-if="destinations.all_disabled">
            <div class="bg-red-50 border-l-4 border-red-500 rounded-lg shadow p-4 mb-4">
                <div class="flex items-start">
                    <svg class="w-6 h-6 text-red-500 mr-3 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"/>
                    </svg>
                    <div>
                        <h3 class="text-red-800 font-semibold">No Backup Destinations Enabled</h3>
                        <p class="text-red-700 text-sm mt-1" x-text="destinations.warning"></p>
                        <p class="text-red-600 text-xs mt-2">Edit config.yaml and set lan_backup.enabled or cloud_backup.enabled to true.</p>
                    </div>
                </div>
            </div>
        </template>

        <!-- Backup Destinations Status -->
        <div class="bg-white rounded-lg shadow p-6 mb-4">
            <h2 class="text-lg font-semibold text-gray-700 mb-3">Backup Destinations</h2>
            <div class="space-y-3">
                <!-- LAN Backup -->
                <div class="flex items-center justify-between py-2 border-b border-gray-100">
                    <div class="flex items-center gap-3">
                        <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2"/>
                        </svg>
                        <div>
                            <span class="font-medium text-gray-700">LAN Backup</span>
                            <p class="text-xs text-gray-400" x-text="destinations.lan.destination"></p>
                        </div>
                    </div>
                    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium"
                          :class="destinations.lan.enabled ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-500'">
                        <span class="w-2 h-2 rounded-full mr-1.5"
                              :class="destinations.lan.enabled ? 'bg-green-500' : 'bg-gray-400'"></span>
                        <span x-text="destinations.lan.enabled ? 'Enabled' : 'Disabled'"></span>
                    </span>
                </div>

                <!-- Cloud Backup -->
                <div class="flex items-center justify-between py-2">
                    <div class="flex items-center gap-3">
                        <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 15a4 4 0 004 4h9a5 5 0 10-.1-9.999 5.002 5.002 0 10-9.78 2.096A4.001 4.001 0 003 15z"/>
                        </svg>
                        <div>
                            <span class="font-medium text-gray-700">Cloud Backup</span>
                            <p class="text-xs text-gray-400" x-text="destinations.cloud.provider + ' — ' + destinations.cloud.bucket"></p>
                        </div>
                    </div>
                    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium"
                          :class="destinations.cloud.enabled ? 'bg-green-100 text-green-800' : 'bg-gray-100 text-gray-500'">
                        <span class="w-2 h-2 rounded-full mr-1.5"
                              :class="destinations.cloud.enabled ? 'bg-green-500' : 'bg-gray-400'"></span>
                        <span x-text="destinations.cloud.enabled ? 'Enabled' : 'Disabled'"></span>
                    </span>
                </div>
            </div>
        </div>

        <!-- Last Run Status -->
        <div class="bg-white rounded-lg shadow p-6 mb-4"
             :class="{
                 'border-l-4 border-green-500': lastStatus === 'Completed',
                 'border-l-4 border-red-500': lastStatus === 'Failed',
                 'border-l-4 border-yellow-500': lastStatus === 'Crashed' || lastStatus === 'Cancelled',
                 'border-l-4 border-gray-300': !lastStatus
             }">
            <h2 class="text-lg font-semibold text-gray-700 mb-2">Last Backup</h2>

            <template x-if="!lastStatus">
                <p class="text-gray-400">No backup runs yet.</p>
            </template>

            <template x-if="lastStatus">
                <div>
                    <div class="flex items-center gap-2 mb-2">
                        <span class="inline-block w-3 h-3 rounded-full"
                              :class="{
                                  'bg-green-500': lastStatus === 'Completed',
                                  'bg-red-500': lastStatus === 'Failed',
                                  'bg-yellow-500': lastStatus === 'Crashed' || lastStatus === 'Cancelled'
                              }"></span>
                        <span class="font-medium" x-text="lastStatus"></span>
                    </div>
                    <div class="text-sm text-gray-500 space-y-1">
                        <p>Started: <span x-text="formatTime(lastStartTime)"></span></p>
                        <p>Duration: <span x-text="formatDuration(lastStartTime, lastEndTime)"></span></p>
                    </div>
                </div>
            </template>
        </div>

        <!-- Next Run -->
        <div class="bg-white rounded-lg shadow p-6 mb-4">
            <h2 class="text-lg font-semibold text-gray-700 mb-2">Next Scheduled Backup</h2>
            <p class="text-gray-600">Tonight at 11:00 PM IST</p>
            <p class="text-sm text-gray-400 mt-1">Countdown: <span x-text="countdown" x-ref="countdown"></span></p>
        </div>

        <!-- Trigger Button -->
        <div class="bg-white rounded-lg shadow p-6">
            <button
                @click="triggerBackup()"
                :disabled="inProgress || triggering || destinations.all_disabled"
                class="w-full py-3 px-4 rounded-lg font-medium transition-colors"
                :class="{
                    'bg-blue-600 text-white hover:bg-blue-700': !inProgress && !triggering && !destinations.all_disabled,
                    'bg-gray-300 text-gray-500 cursor-not-allowed': inProgress || triggering || destinations.all_disabled
                }">
                <span x-show="!triggering" x-text="inProgress ? 'Backup Running...' : (destinations.all_disabled ? 'No Destinations Configured' : 'Run Backup Now')"></span>
                <span x-show="triggering">Starting...</span>
            </button>
            <p x-show="triggerMessage" class="text-sm mt-2 text-center"
               :class="triggerSuccess ? 'text-green-600' : 'text-red-600'"
               x-text="triggerMessage"></p>
        </div>

        <!-- Prefect UI Link -->
        <div class="text-center mt-6">
            <a href="http://127.0.0.1:4200" target="_blank"
               class="text-blue-600 hover:text-blue-800 text-sm underline">
                Open Prefect UI →
            </a>
        </div>
    </div>

    <script>
        function backupStatus() {
            return {
                lastStatus: null,
                lastStartTime: null,
                lastEndTime: null,
                inProgress: false,
                triggering: false,
                triggerMessage: '',
                triggerSuccess: false,
                countdown: '',
                destinations: {{ destinations | tojson }},

                init() {
                    this.updateCountdown();
                    setInterval(() => this.updateCountdown(), 1000);
                    // Auto-refresh every 60 seconds
                    setInterval(() => location.reload(), 60000);
                },

                updateCountdown() {
                    const now = new Date();
                    // Next run at 23:00 IST (UTC+5:30)
                    const target = new Date();
                    target.setHours(23, 0, 0, 0);
                    if (now >= target) {
                        target.setDate(target.getDate() + 1);
                    }
                    const diff = target - now;
                    const hours = Math.floor(diff / 3600000);
                    const minutes = Math.floor((diff % 3600000) / 60000);
                    const seconds = Math.floor((diff % 60000) / 1000);
                    this.countdown = `${hours}h ${minutes}m ${seconds}s`;
                },

                formatTime(isoString) {
                    if (!isoString) return '—';
                    const d = new Date(isoString);
                    return d.toLocaleString();
                },

                formatDuration(start, end) {
                    if (!start || !end) return '—';
                    const diff = (new Date(end) - new Date(start)) / 1000;
                    const mins = Math.floor(diff / 60);
                    const secs = Math.floor(diff % 60);
                    return `${mins}m ${secs}s`;
                },

                async triggerBackup() {
                    this.triggering = true;
                    this.triggerMessage = '';
                    try {
                        const resp = await fetch('/trigger', { method: 'POST' });
                        const data = await resp.json();
                        this.triggerMessage = data.message;
                        this.triggerSuccess = data.status === 'ok';
                        if (this.triggerSuccess) {
                            this.inProgress = true;
                        }
                    } catch (e) {
                        this.triggerMessage = 'Failed to trigger backup';
                        this.triggerSuccess = false;
                    }
                    this.triggering = false;
                }
            }
        }
    </script>
</body>
</html>
